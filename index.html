<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png?v=darkmetal-20260228" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png?v=darkmetal-20260228" />
    <link rel="apple-touch-icon" href="/logo.png?v=darkmetal-20260228" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:wght@400;700;900&family=Noto+Sans+Bengali:wght@400;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#130c05" />
    <meta name="description" content="BARMAN STORE - Groceries, daily essentials, and quick delivery for your neighborhood." />
    <meta name="keywords" content="Barman Store, groceries, daily essentials, household items, delivery" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://barmanstore.vercel.app" />
    <meta property="og:title" content="BARMAN STORE" />
    <meta property="og:description" content="Groceries, daily essentials, and quick delivery for your neighborhood." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://barmanstore.vercel.app" />
    <meta property="og:image" content="/logo.png?v=darkmetal-20260228" />
    <title>BARMAN STORE</title>
    <style>
      .boot-shell {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(14, 165, 233, 0.12), transparent 28%),
          linear-gradient(180deg, #f8fbff 0%, #edf4fb 100%);
        color: #0f172a;
        font-family: "Space Mono", monospace;
      }

      .boot-shell__card {
        width: min(100%, 520px);
        padding: 24px;
        border: 1px solid #d4e1ee;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }

      .boot-shell__kicker {
        margin: 0 0 8px;
        color: #0369a1;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .boot-shell__card h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      .boot-shell__card p {
        margin: 12px 0 0;
        color: #475569;
        font-size: 14px;
        line-height: 1.6;
      }

      .boot-shell__pulse {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 18px;
      }

      .boot-shell__pulse span {
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(90deg, #dbeafe, #bfdbfe, #dbeafe);
        background-size: 200% 100%;
        animation: bootPulse 1.2s linear infinite;
      }

      .boot-shell__pulse span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .boot-shell__pulse span:nth-child(3) {
        animation-delay: 0.3s;
      }

      .boot-noscript {
        width: min(100%, 520px);
        margin: 12px auto 0;
        padding: 0 24px 24px;
        color: #0f172a;
        font-family: "Space Mono", monospace;
      }

      .boot-noscript__card {
        padding: 18px 20px;
        border: 1px solid #fecaca;
        border-radius: 18px;
        background: #fff1f2;
        color: #9f1239;
      }

      .boot-noscript__card strong {
        display: block;
        margin-bottom: 8px;
      }

      @keyframes bootPulse {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BARMAN STORE",
        "url": "https://barmanstore.vercel.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://barmanstore.vercel.app/products?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-live="polite">
        <div class="boot-shell__card">
          <p class="boot-shell__kicker">Barman Store</p>
          <h1>Loading workspace...</h1>
          <p>Preparing the application shell for billing, purchase entry, and the storefront.</p>
          <p>If this screen stays here for more than a few seconds, reload the page.</p>
          <div class="boot-shell__pulse" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <div class="boot-noscript">
        <div class="boot-noscript__card">
          <strong>JavaScript is required.</strong>
          Billing and purchase workspaces need JavaScript to open and run correctly.
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
